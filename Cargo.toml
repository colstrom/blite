# Cargo.toml

[package]
name = "blite"
version = "0.9.0"
edition = "2024"
rust-version = "1.95"

license = "MIT OR Apache-2.0"
repository = "https://github.com/colstrom/blite"
authors = ["Chris Olstrom <chris@olstrom.com>"]
keywords = ["cli", "search"]
categories = ["command-line-utilities", "development-tools"]
description = "Boring Local Information Telling Engine - tells you things you might want to know, using information you already have"

[dependencies]
bon = "3.10.3"
camino = { version = "1.2.6", features = ["serde1"] }
candle-core = "0.11.1"
candle-nn = "0.11.1"
candle-transformers = "0.11.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
fs-err = "3.3.2"
gix = { version = "0.90.0", default-features = false, features = ["blob-diff", "revision", "sha1"] }
hf-hub = { version = "1.0.0", features = ["blocking", "rustls-tls"] }
ignore = "0.4.34"
instant-distance = "0.6.1"
jiff = { version = "1.0.0", features = ["serde"] }
miette = { version = "7.6.0", features = ["fancy"] }
nutype = { version = "0.8.0", features = ["serde"] }
rayon = "1.12.0"
regex-lite = "0.1.9"
rustyline = { version = "19.0.0", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.1.1", features = ["miette"] }
serde_json = "1.0.154"
similar = "3.2.1"
syntect = { version = "5.3.0", features = ["default-fancy"] }
tantivy = "0.27.0"
thiserror = "2.0.21"
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tree-sitter = "0.25.10"
tree-sitter-bash = "0.25.1"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-just = "0.2.0"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11.1", features = ["metal", "accelerate"] }
candle-nn = { version = "0.11.1", features = ["metal", "accelerate"] }
candle-transformers = { version = "0.11.1", features = ["metal", "accelerate"] }

[lints.rust]
unused_qualifications = "warn"

[lints.clippy]
absolute_paths = "warn"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
incremental = false
lto = "fat"
opt-level = 3
strip = true
panic = "abort"
